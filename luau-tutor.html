<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luau Tutorial Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }
        
        .header-image {
            width: 300px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .header-image:hover {
            transform: scale(1.05);
        }
        
        .image-container {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            align-items: center;
        }
        
        .header-content {
            text-align: center;
        }
        
        .header-content.hidden {
            display: none;
        }
        
        .tutor-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            margin-top: 20px;
        }
        
        h1 {
            font-size: 3em;
            color: white;
            margin-bottom: 30px;
            cursor: pointer;
            transition: transform 0.3s;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        h1:hover {
            transform: scale(1.05);
        }
        
        .subtitle {
            font-size: 1.2em;
            color: white;
            margin-bottom: 30px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3);
        }
        
        .question-box {
            display: none;
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: left;
        }
        
        .question-box.active {
            display: block;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .question-title {
            font-size: 1.3em;
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .question-text {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            display: block;
            border-radius: 5px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            overflow-x: auto;
        }
        
        .options {
            margin-top: 20px;
        }
        
        .option {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: all 0.3s;
        }
        
        .option:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }
        
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        
        .option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .next-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .next-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        
        .score {
            font-size: 1.2em;
            color: #764ba2;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    
        <div class="header-content" id="headerContent">
            <h1 onclick="startQuiz()">🥁 tung tung tung sahur</h1>
            <p class="subtitle">Click the image to start Luau tutorial questions!</p>
        </div>
        
        <div class="tutor-container">
            <div class="question-box" id="questionBox">
                <div class="question-title" id="questionTitle">Question 1</div>
                <div class="question-text" id="questionText"></div>
                <div id="codeBlock"></div>
                <div class="options" id="options"></div>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display: none;">Next Question</button>
            </div>
            
            <div class="score" id="score"></div>
        </div>
    </div>
    
    <script>
        const questions = [
            {
                question: "What keyword is used to declare a local variable in Luau?",
                code: "??? myVariable = 10",
                options: ["var", "let", "local", "dim"],
                correct: 2
            },
            {
                question: "How do you print text to the output in Luau?",
                code: "???('Hello World')",
                options: ["console.log", "print", "echo", "write"],
                correct: 1
            },
            {
                question: "What is the correct syntax for a for loop in Luau?",
                options: [
                    "for (i = 1; i <= 10; i++)",
                    "for i = 1, 10 do",
                    "for i in range(1, 10)",
                    "for i to 10"
                ],
                correct: 1
            },
            {
                question: "How do you define a function in Luau?",
                options: [
                    "function myFunc() end",
                    "def myFunc():",
                    "func myFunc() {}",
                    "fn myFunc() {}"
                ],
                correct: 0
            },
            {
                question: "What symbol is used for string concatenation in Luau?",
                code: "local text = 'Hello' ??? 'World'",
                options: ["+", "&", "..", "*"],
                correct: 2
            },
            {
                question: "How do you create a table (array) in Luau?",
                options: [
                    "local arr = [1, 2, 3]",
                    "local arr = {1, 2, 3}",
                    "local arr = array(1, 2, 3)",
                    "local arr = new Array(1, 2, 3)"
                ],
                correct: 1
            },
            {
                question: "What does 'ipairs' do in Luau?",
                code: "for i, v in ipairs(myTable) do end",
                options: [
                    "Iterates through table keys only",
                    "Iterates through array-like tables with indices",
                    "Pairs two tables together",
                    "Creates a new table"
                ],
                correct: 1
            },
            {
                question: "How do you write a single-line comment in Luau?",
                options: [
                    "// This is a comment",
                    "# This is a comment",
                    "-- This is a comment",
                    "/* This is a comment */"
                ],
                correct: 2
            }
        ];
        
        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        
        function startQuiz() {
            document.getElementById('headerContent').classList.add('hidden');
            document.getElementById('questionBox').classList.add('active');
            const images = document.querySelectorAll('.header-image');
            images.forEach(img => {
                img.style.cursor = 'default';
                img.onclick = null;
            });
            showQuestion();
        }
        
        function showQuestion() {
            answered = false;
            const q = questions[currentQuestion];
            document.getElementById('questionTitle').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            document.getElementById('questionText').textContent = q.question;
            
            // Show code block if exists
            const codeBlock = document.getElementById('codeBlock');
            if (q.code) {
                codeBlock.innerHTML = `<code>${q.code}</code>`;
            } else {
                codeBlock.innerHTML = '';
            }
            
            // Show options
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            q.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.textContent = option;
                optionDiv.onclick = () => selectOption(index);
                optionsDiv.appendChild(optionDiv);
            });
            
            document.getElementById('nextBtn').style.display = 'none';
        }
        
        function selectOption(selected) {
            if (answered) return;
            answered = true;
            
            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            
            if (selected === q.correct) {
                options[selected].classList.add('correct');
                score++;
            } else {
                options[selected].classList.add('wrong');
                options[q.correct].classList.add('correct');
            }
            
            document.getElementById('nextBtn').style.display = 'block';
            updateScore();
        }
        
        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function updateScore() {
            document.getElementById('score').textContent = `Score: ${score}/${questions.length}`;
        }
        
        function showResults() {
            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('questionBox').innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <h2 style="color: #764ba2; font-size: 2em; margin-bottom: 20px;">Quiz Complete! 🎉</h2>
                    <p style="font-size: 1.5em; color: #333;">You scored: ${score}/${questions.length} (${percentage}%)</p>
                    <p style="font-size: 1.2em; color: #666; margin-top: 20px;">
                        ${percentage >= 80 ? 'Excellent work! You know your Luau!' : 
                          percentage >= 60 ? 'Good job! Keep practicing!' : 
                          'Keep learning! Try again to improve!'}
                    </p>
                    <button class="next-btn" onclick="location.reload()">Start Over</button>
                </div>
            `;
        }
    </script>
</body>
</html>
